<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ホームページ制作君 - AI Homepage Builder</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .subtitle {
            font-size: 1.2rem;
            opacity: 0.9;
        }

        .main-card {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        .input-section {
            margin-bottom: 30px;
        }

        .input-section h2 {
            font-size: 1.3rem;
            color: #333;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
        }

        .input-section h2::before {
            content: '';
            width: 4px;
            height: 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin-right: 10px;
            border-radius: 2px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #555;
        }

        input[type="url"],
        textarea {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1rem;
            transition: all 0.3s;
            font-family: inherit;
        }

        input[type="url"]:focus,
        textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        textarea {
            resize: vertical;
            min-height: 120px;
        }

        .button-group {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }

        button {
            flex: 1;
            padding: 15px 30px;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-secondary {
            background: #f5f5f5;
            color: #333;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
            color: #667eea;
        }

        .loading.active {
            display: block;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .result-section {
            display: none;
            margin-top: 40px;
            padding-top: 40px;
            border-top: 2px solid #e0e0e0;
        }

        .result-section.active {
            display: block;
        }

        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .result-header h2 {
            font-size: 1.5rem;
            color: #333;
        }

        .preview-frame {
            width: 100%;
            min-height: 600px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            background: white;
        }

        .error {
            background: #fee;
            border: 2px solid #fcc;
            color: #c33;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            display: none;
        }

        .error.active {
            display: block;
        }

        .tab-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .tab-btn {
            padding: 10px 20px;
            background: #f5f5f5;
            border: 2px solid transparent;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }

        .tab-btn.active {
            background: white;
            border-color: #667eea;
            color: #667eea;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .code-view {
            background: #282c34;
            color: #abb2bf;
            padding: 20px;
            border-radius: 10px;
            overflow-x: auto;
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            line-height: 1.5;
            max-height: 600px;
            overflow-y: auto;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2rem;
            }

            .main-card {
                padding: 20px;
            }

            .button-group {
                flex-direction: column;
            }

            .result-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }
        }

        .info-box {
            background: #e3f2fd;
            border-left: 4px solid #2196f3;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 5px;
            font-size: 0.95rem;
            color: #1565c0;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎨 ホームページ制作君</h1>
            <p class="subtitle">AIが参考URLやHTMLからおしゃれなホームページを生成します</p>
        </header>

        <div class="main-card">
            <div class="info-box">
                💡 参考URL、HTMLソース、またはその両方を入力してください。AIがモダンでおしゃれなホームページを生成します。
            </div>

            <div class="input-section">
                <h2>参考URL</h2>
                <label for="referenceUrl">デザインの参考にしたいWebサイトのURL</label>
                <input type="url" id="referenceUrl" placeholder="https://example.com">
            </div>

            <div class="input-section">
                <h2>HTMLソース</h2>
                <label for="sourceHtml">改善したいHTMLコード（オプション）</label>
                <textarea id="sourceHtml" placeholder="<!DOCTYPE html>&#10;<html>&#10;..."></textarea>
            </div>

            <div class="input-section">
                <h2>追加の要望</h2>
                <label for="requirements">デザインや機能についての要望（オプション）</label>
                <textarea id="requirements" placeholder="例: ダークモード対応、アニメーション多め、ミニマルなデザインなど"></textarea>
            </div>

            <div class="button-group">
                <button class="btn-primary" onclick="generateHomepage()">
                    ✨ ホームページを生成
                </button>
                <button class="btn-secondary" onclick="resetForm()">
                    🔄 リセット
                </button>
            </div>

            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>AIがおしゃれなホームページを生成中...</p>
            </div>

            <div class="error" id="error"></div>

            <div class="result-section" id="resultSection">
                <div class="result-header">
                    <h2>生成結果</h2>
                    <button class="btn-secondary" onclick="downloadHtml()">
                        💾 HTMLをダウンロード
                    </button>
                </div>

                <div class="tab-buttons">
                    <button class="tab-btn active" onclick="switchTab('preview')">プレビュー</button>
                    <button class="tab-btn" onclick="switchTab('code')">HTMLコード</button>
                </div>

                <div class="tab-content active" id="previewTab">
                    <iframe id="previewFrame" class="preview-frame"></iframe>
                </div>

                <div class="tab-content" id="codeTab">
                    <pre class="code-view" id="codeView"></pre>
                </div>
            </div>
        </div>
    </div>

    <script>
        let generatedHtml = '';

        async function generateHomepage() {
            const referenceUrl = document.getElementById('referenceUrl').value.trim();
            const sourceHtml = document.getElementById('sourceHtml').value.trim();
            const requirements = document.getElementById('requirements').value.trim();

            // Validate input
            if (!referenceUrl && !sourceHtml) {
                showError('参考URLまたはHTMLソースのいずれかを入力してください。');
                return;
            }

            // Hide error and result
            hideError();
            document.getElementById('resultSection').classList.remove('active');

            // Show loading
            document.getElementById('loading').classList.add('active');

            try {
                let referenceHtml = '';

                // Fetch reference URL if provided
                if (referenceUrl) {
                    const fetchResponse = await fetch('/api/fetch-url', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({ url: referenceUrl })
                    });

                    if (!fetchResponse.ok) {
                        const errorData = await fetchResponse.json();
                        throw new Error(errorData.error || 'URLの取得に失敗しました');
                    }

                    const fetchData = await fetchResponse.json();
                    referenceHtml = fetchData.html;
                }

                // Generate homepage
                const generateResponse = await fetch('/api/generate', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        referenceHtml: referenceHtml,
                        sourceHtml: sourceHtml,
                        requirements: requirements
                    })
                });

                if (!generateResponse.ok) {
                    const errorData = await generateResponse.json();
                    throw new Error(errorData.error || '生成に失敗しました');
                }

                const generateData = await generateResponse.json();
                generatedHtml = generateData.html;

                // Display result
                displayResult(generatedHtml);

            } catch (error) {
                showError(error.message);
            } finally {
                document.getElementById('loading').classList.remove('active');
            }
        }

        function displayResult(html) {
            // Update preview
            const iframe = document.getElementById('previewFrame');
            iframe.srcdoc = html;

            // Update code view
            document.getElementById('codeView').textContent = html;

            // Show result section
            document.getElementById('resultSection').classList.add('active');

            // Scroll to result
            document.getElementById('resultSection').scrollIntoView({ behavior: 'smooth' });
        }

        function switchTab(tab) {
            // Update tab buttons
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');

            // Update tab content
            document.querySelectorAll('.tab-content').forEach(content => {
                content.classList.remove('active');
            });

            if (tab === 'preview') {
                document.getElementById('previewTab').classList.add('active');
            } else if (tab === 'code') {
                document.getElementById('codeTab').classList.add('active');
            }
        }

        function downloadHtml() {
            const blob = new Blob([generatedHtml], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'generated-homepage.html';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function resetForm() {
            document.getElementById('referenceUrl').value = '';
            document.getElementById('sourceHtml').value = '';
            document.getElementById('requirements').value = '';
            document.getElementById('resultSection').classList.remove('active');
            hideError();
        }

        function showError(message) {
            const errorEl = document.getElementById('error');
            errorEl.textContent = '❌ エラー: ' + message;
            errorEl.classList.add('active');
        }

        function hideError() {
            document.getElementById('error').classList.remove('active');
        }
    </script>
</body>
</html>
